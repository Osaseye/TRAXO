<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TRAXO — Institutional Trading Intelligence</title>
    <meta name="description" content="Personal algorithmic trading desk. Institutional structure detection, 9-point mathematical risk guardrails, and real-time execution across Forex, Gold, and Nasdaq Futures." />

    <!-- PWA & Mobile Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090B" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRAXO" />
    <meta name="application-name" content="TRAXO" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/traxo-mark.png" color="#34D399" />

    <!-- Open Graph / WhatsApp / Facebook Preview Card -->
    <meta property="og:site_name" content="TRAXO" />
    <meta property="og:title" content="TRAXO — Institutional Trading Intelligence" />
    <meta property="og:description" content="Personal algorithmic trading desk. Institutional structure detection, 9-point mathematical risk guardrails, and real-time execution across Forex, Gold, and Nasdaq Futures." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://traxo.app/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:secure_url" content="https://traxo.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TRAXO — Institutional Trading Intelligence & Execution" />

    <!-- Twitter / X Preview Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRAXO — Institutional Trading Intelligence" />
    <meta name="twitter:description" content="Personal algorithmic trading desk. Institutional structure detection, 9-point mathematical risk guardrails, and real-time execution." />
    <meta name="twitter:image" content="https://traxo.app/og-image.png" />
    <meta name="twitter:image:alt" content="TRAXO Trading Terminal" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background-color: #09090B;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #09090B;
        z-index: 9999;
      }
      .loader-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 50%;
        filter: blur(60px);
        animation: pulse 3s infinite ease-in-out;
      }
      .loader-dots {
        display: flex;
        gap: 6px;
        margin-top: 24px;
      }
      .loader-dot {
        width: 5px;
        height: 5px;
        background-color: #FAFAFA;
        border-radius: 50%;
        animation: bounce 1.2s infinite ease-in-out;
      }
      .loader-dot:nth-child(1) { animation-delay: 0s; }
      .loader-dot:nth-child(2) { animation-delay: 0.2s; }
      .loader-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); opacity: 0.2; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="loader-glow"></div>
        <div style="position: relative; z-index: 10; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.2em; color: rgba(250,250,250,0.9); text-transform: uppercase;">TRAXO</div>
        <div class="loader-dots">
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
          <div class="loader-dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
